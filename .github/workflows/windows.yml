name: Build Windows Portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Prepare official OpenAI local SDK and dependencies
        shell: pwsh
        run: .\scripts\setup-windows.ps1
      - name: Run unit tests
        shell: pwsh
        run: npm run check
      - name: Build portable EXE
        shell: pwsh
        run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: Novel-NAME-Plus-Windows
          path: release/*.exe
          if-no-files-found: error
