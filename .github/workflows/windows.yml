name: Đóng gói Windows và phát hành bản cập nhật
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/RELEASE_REQUEST'
concurrency:
  group: novel-name-plus-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Kiểm tra phiên bản phát hành
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $requested = (Get-Content '.github/RELEASE_REQUEST' -Raw).Trim()
          $actual = "v$(node -p "require('./package.json').version")"
          if ($requested -ne $actual) { throw "RELEASE_REQUEST=$requested, package=$actual không khớp." }
      - name: Cài SDK OpenAI chính thức và các thành phần
        shell: pwsh
        run: .\scripts\setup-windows.ps1
      - name: Kiểm thử bộ lọc và chức năng cập nhật
        shell: pwsh
        run: npm run check
      - name: Đóng gói Setup và Portable
        shell: pwsh
        run: npm run pack:win
      - name: Kiểm tra tệp cập nhật trước khi phát hành
        shell: pwsh
        run: |
          $manifest = Get-Item 'release/latest.yml' -ErrorAction Stop
          $setup = Get-ChildItem 'release/Novel-NAME-Plus-Setup-*.exe'
          if (@($setup).Count -lt 1) { throw 'Không tạo được Setup EXE.' }
          Write-Host "Release manifest: $($manifest.Name)"
      - name: Đăng tải gói Windows (để kiểm tra thủ công)
        uses: actions/upload-artifact@v4
        with:
          name: Novel-NAME-Plus-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Xuất bản GitHub Release khi có RELEASE_REQUEST
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = (Get-Content '.github/RELEASE_REQUEST' -Raw).Trim()
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GitHub Release $tag đã tồn tại, không ghi đè."
            exit 0
          }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.yml','.blockmap' } | ForEach-Object { $_.FullName })
          if (@($assets).Count -lt 2) { throw 'Thiếu file phát hành hoặc latest.yml.' }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Novel NAME Plus $tag" --latest --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release thất bại.' }
